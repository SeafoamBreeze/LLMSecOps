name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # -------------------------
  # 1. Unit tests for day02
  # -------------------------
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements_day02.txt

      - name: Lint day02
        run: flake8 day02.py

      - name: Test day02
        run: python -m unittest discover -s tests -p "*.py" -v

# --------------------------------------------
  # 2. Build and Push Docker image
  # --------------------------------------------
  push_image:
    runs-on: ubuntu-latest
    needs: unit_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fastapi-app:latest

  # --------------------------------------------
  # 3. Trivy scan on remote image
  # --------------------------------------------
  trivy_scan:
    runs-on: ubuntu-latest
    needs: push_image
    steps:
      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/fastapi-app:latest
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'