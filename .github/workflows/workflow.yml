name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # -------------------------
  # 1. Unit tests for day02
  # -------------------------
  day02:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements_day02.txt

      - name: Lint day02
        run: flake8 day02.py

      - name: Test day02
        run: python -m unittest discover -s tests -p "*.py" -v

  # --------------------------------------------
  # 2. Build Docker image (NOT pushing yet)
  # --------------------------------------------
  build-docker:
    runs-on: ubuntu-latest
    needs: day02
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fastapi-app:latest

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myusername/fastapi-app:latest
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # --------------------------------------------
  # 3. Push image 
  # --------------------------------------------
  push_image:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to DOCKER
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fastapi-app:latest
